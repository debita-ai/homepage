name: CI/CD (staging)

on:
  push:
    branches: [ staging ]

jobs:
  build_and_push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/debita-ai/${{ github.event.repository.name }}:staging
            ghcr.io/debita-ai/${{ github.event.repository.name }}:${{ github.sha }}

  deploy:
    name: Deploy to Hostinger VPS
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and update containers
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/debita_ai/staging

            # Expande o nome do repositório aqui no runner
            SERVICE=${{ github.event.repository.name }}
            echo ">>> Atualizando serviço: $SERVICE"

            # Só puxa e sobe o container alterado
            docker compose pull "$SERVICE"
            docker compose up -d "$SERVICE"
